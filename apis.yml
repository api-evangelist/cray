  public developer portal, API reference, or API surface — its supercomputing systems, ClusterStor storage,
  and Slingshot interconnect are marketed and supported under HPE. Enrichment found no first-party Cray API,
  OpenAPI, SDKs, or documentation to harvest. The norwest-venture-partners backing recorded on this stub is
  a legacy venture-history association, not a current independent company relationship.'
